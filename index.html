<body>
  <a class="skip-link" href="./enter.html">Enter site</a>

  <!-- The gate's "Click to enter" is a REAL link (stretched over the whole gate via CSS)
       so entering works even if JS never runs. JS only adds the cyan flash + corridor. -->
  <div id="gate" class="gate">
    <canvas id="gate-canvas" aria-hidden="true"></canvas>
    <div class="gate-inner">
      <img class="gate-emblem" src="./assets/exports/phantombugz-emblem-300.png" alt="" width="150" height="150">
      <h1 class="gate-name">PHANTOMBUGZ</h1>
      <p class="gate-intro">Ethical hacking &amp; bug bounty collective. Strong enough to destroy &mdash; we choose to protect.</p>
      <p class="gate-enter"><a class="gate-link" href="./enter.html"><span>Click to enter</span></a></p>
    </div>
  </div>

  <header class="site-header" aria-label="Primary">
    <a class="brand-lockup" href="./enter.html" aria-label="PhantomBugz">
      <img src="./assets/exports/phantombugz-emblem-96.png" alt="" aria-hidden="true" width="34" height="34">

    </nav>

  <main>
    <section id="corridor" class="corridor" aria-label="Enter PhantomBugz">
      <div class="corridor-viewport">
        <div class="corridor-space">
          <div class="surface surface--floor"><canvas></canvas></div>
          <div class="surface surface--ceiling"><canvas></canvas></div>
          <div class="surface surface--left"><canvas></canvas></div>
          <div class="surface surface--right"><canvas></canvas></div>
          <div class="corridor-emblem">
            <img src="./assets/exports/phantombugz-emblem-300.png" alt="" aria-hidden="true">
          </div>
        </div>
        <p class="scroll-cue" aria-hidden="true"><span>scroll into the system</span></p>
      </div>
    </section>

  </main>

  <!-- Sling overlay: floods cyan and rushes forward as the corridor releases into the main page. -->
  <div id="sling" class="sling" aria-hidden="true"></div>

  <script type="module" src="./main.js"></script>
